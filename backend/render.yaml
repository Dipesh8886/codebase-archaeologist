services:
  # Main API — handles auth, Q&A requests, graph requests, and now also
  # runs the indexing worker in-process (Render's free tier only
  # supports one always-on service, so both live here).
  - type: web
    name: codebase-archaeologist-api
    runtime: node
    plan: free
    buildCommand: npm install && bash scripts/fetch-grammars.sh
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Remaining secrets (GITHUB_CLIENT_ID, MONGODB_URI, REDIS_URL, etc.)
      # are set in the Render dashboard, not committed here.